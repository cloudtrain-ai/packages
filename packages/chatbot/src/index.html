<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>CloudTrain Chatbot — Dev Harness</title>

  <style>
    :root {
      --bg: #0a0a0b;
      --fg: #fafafa;
      --muted: #71717a;
      --border: #27272a;
      --accent: #22d3ee;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px 20px 120px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-bottom: 24px; }
    .row { display: flex; gap: 8px; max-width: 720px; margin: 0 auto 16px; }
    .row button {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .row button:hover { background: rgba(255,255,255,0.04); }
    .log-box {
      max-width: 720px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 60vh;
      overflow-y: auto;
      font-family: Menlo, monospace;
    }
    .log-header {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .log-row { color: #e4e4e7; font-size: 11px; margin-bottom: 4px; word-break: break-all; }
    .log-time { color: var(--muted); }
    .log-kind { color: var(--accent); }
    .log-empty { color: #52525b; font-size: 12px; font-style: italic; }
  </style>

  <script type="module" src="/build/cloudtrain-chatbot.esm.js"></script>
  <script nomodule src="/build/cloudtrain-chatbot.js"></script>
</head>

<body>
  <h1>CloudTrain Chatbot — Dev Harness</h1>
  <p class="hint">Persistence: on · Pre-chat: on · Events: logged</p>

  <div class="row">
    <button id="read-storage">Read localStorage</button>
    <button id="clear-storage">Clear</button>
  </div>

  <div class="log-box">
    <div class="log-header">Event log</div>
    <div id="log"><span class="log-empty">Open chat to see events</span></div>
  </div>

  <cloudtrain-chatbot
    id="bot"
    api-key="ct_2CgnMxajqm2KuyOrOv0CppuMcENCkBvQu3U9bB64M1U"
    theme="system"
    hide-branding="false"
    require-pre-chat="true"
  ></cloudtrain-chatbot>

  <script>
    const bot = document.getElementById('bot');
    const logEl = document.getElementById('log');
    let logEntries = [];

    // Configure props that require JS (arrays, objects)
    bot.chatSuggestions = ['What can you do?', 'Pricing', 'Talk to sales'];
    bot.preChatFields = [
      { name: 'name', label: 'Your name', required: true },
      { name: 'email', label: 'Your email', type: 'email', required: true },
      { name: 'company', label: 'Company', placeholder: 'Optional' },
    ];

    function push(kind, text) {
      logEntries.unshift({ time: new Date().toLocaleTimeString(), kind, text });
      logEntries = logEntries.slice(0, 30);
      logEl.innerHTML = logEntries.map(e =>
        `<div class="log-row"><span class="log-time">${e.time} </span><span class="log-kind">[${e.kind}] </span>${escapeHtml(e.text)}</div>`
      ).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Event listeners — all six emitted by the widget
    bot.addEventListener('chatOpened', () => push('chatOpened', '—'));
    bot.addEventListener('chatClosed', () => push('chatClosed', '—'));
    bot.addEventListener('messageSent', (e) => push('messageSent', e.detail.text));
    bot.addEventListener('messageReceived', (e) => {
      const t = e.detail.text;
      push('messageReceived', t.length > 80 ? t.slice(0, 80) + '…' : t);
    });
    bot.addEventListener('conversationReset', () => push('conversationReset', '—'));
    bot.addEventListener('errorOccurred', (e) => push('errorOccurred', e.detail.message));
    bot.addEventListener('leadCaptured', (e) => push('leadCaptured', JSON.stringify(e.detail)));

    // Diagnostic buttons
    document.getElementById('read-storage').addEventListener('click', () => {
      const raw = localStorage.getItem('cloudtrain-chat');
      push('storage', raw ? raw.slice(0, 200) + (raw.length > 200 ? '…' : '') : '(empty)');
    });
    document.getElementById('clear-storage').addEventListener('click', () => {
      localStorage.removeItem('cloudtrain-chat');
      push('storage', 'cleared');
    });
  </script>
</body>

</html>
