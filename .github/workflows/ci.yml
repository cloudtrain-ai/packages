name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build
        working-directory: packages/sdk

      - name: Build Chatbot
        run: bun run build
        working-directory: packages/chatbot

      - name: Build React Wrapper
        run: bun run build
        working-directory: packages/chatbot-react
